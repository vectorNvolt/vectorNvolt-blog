[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Code for the 'Agent sandbox' chapter of the Vector n Volt blog."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "PyYAML>=6.0",
    "docker>=7.0",
]

[project.scripts]
agent-sandbox = "agent_sandbox.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_sandbox*"]
