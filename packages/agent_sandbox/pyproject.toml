[project]
name = "agent-sandbox"
version = "0.1.0"
description = "LangGraph harness driving the Claude CLI inside a gVisor-sandboxed container."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "PyYAML>=6.0",
    "docker>=7.0",
    # The renderer feeds sandbox-controlled text to these three on the host: pinned,
    # so what the post probed is what runs. requirements-lock.txt holds the full tree.
    "rich==15.0.0",
    "markdown-it-py==4.2.0",
    "Pygments==2.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-sandbox = "agent_sandbox.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_sandbox*"]
