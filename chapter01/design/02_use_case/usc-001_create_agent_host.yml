    - "`/etc/wsl.conf` holds the listed settings; `/etc/resolv.conf` is a regular file naming `1.1.1.1` and `9.9.9.9`; the hostname is `agent-host`; `agent-host-isolate.service` is enabled and active (exited), `/mnt/wslg`, `/tmp/.X11-unix`, `/mnt/wsl` and `/usr/lib/wsl` are not mountpoints, `/dev/dxg` is absent or masked by `/dev/null`, and `/usr/lib/wsl/lib` and `/usr/lib/wsl/drivers` are empty; docker requires the isolate service, so it does not start if isolation fails"
    - "Docker engine (`docker.io`, with `docker-buildx`; service enabled and running), gVisor (`runsc`), Python 3, gnome-keyring, git, tar, nftables (`nft`), iptables, iproute2 (`ip`, `bridge`), ca-certificates, curl and gnupg are available in `agent-host`"
    - "`runsc` is registered as a Docker runtime in `/etc/docker/daemon.json` inside `agent-host` (path `/usr/local/bin/runsc`, exactly the eight runtimeArgs `--platform=systrap`, `--network=sandbox`, `--net-raw=false`, `--allow-flag-override=false`, `--overlay2=root:memory`, `--file-access=exclusive`, `--file-access-mounts=shared`, `--directfs=false`) and dockerd was restarted afterwards"
    - "`/usr/local/bin/create_agent_container`, `/usr/local/bin/remove_agent_container`, `/usr/local/bin/create_agent_net`, `/usr/local/bin/remove_agent_net`, `/usr/local/bin/agent_lifecycle`, `/usr/local/bin/enter_agent` and `/usr/local/bin/refresh_endpoints` are installed as `root:root`, mode 755, each with the same SHA-256 as its Windows copy (built in `dev-distro` into `dist/`)"
    - "`agent-restore.service` and `agent-guard.service` are installed (`root:root`, 644), enabled and running; `agents-net` and its gate exist and `/run/agent-sandbox/ready` is written after each dockerd start; the guard removes an agent container that is started, unpaused, restarted or reconnected with its gate not passing `check-gate`, after a successful disarm (a failed disarm leaves it in place), and does not re-arm it"
    - "Docker/gVisor configuration exists only inside `agent-host`; `dev-distro` is untouched and Windows is changed only by the install directory (the temporary rootfs file is removed at the end). This is a structural guarantee (the WSL adapter addresses only `agent-host`), not a before/after measurement"
    - "Isolation scope: all WSL2 distros still share one VM (kernel, network); `agent-host` is not a VM, kernel or network boundary. The isolation limits the distro's reach toward Windows; it does not block `wsl -d agent-host` or `\\\\wsl.localhost\\agent-host` from Windows"
    - "The whole setup was produced by one run of `create_agent_host`"
