# `# open` = conflict inside USS-004; needs a decision before SFR derivation.
# Scope: creation of `agents-net`. The subcommands of the same binary are
# covered as alternative flows so their contract stays with the tool that
# ships them: `arm <container>` (alt-1, called by USC-002), `disarm <container>`
# (alt-2, called by USC-006 and reused by USC-007 and by the guard of
# agent-sandbox; behaviour specified in USS-007), `check-gate <container>`
# (alt-3, read-only), `released` (alt-4, read-only, used by the guard) and
