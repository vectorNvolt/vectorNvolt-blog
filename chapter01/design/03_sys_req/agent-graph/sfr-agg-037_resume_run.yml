SFR-AGG-037:
  title: "Resume a suspended run"
  kind: "functional"
  usecase_step_ref: "USC-008: step 1 (alternative alt-1)"

  statement: "The system shall resume a suspended or interrupted run from its checkpoint."

  condition: "When the developer starts the run command with the resume option for a run that has a checkpoint (the argument check of SFR-AGG-001 passed; an unknown run or a run without a checkpoint is its usage error err-17)."

  interface_points:
    - "IP-CLI-AGENT-GRAPH-RUN Agent graph run command-line entrypoint"
    - "IP-AGENT-RUN-WORKSPACE Agent run workspace"
    - "IP-DOCKER-ENGINE Docker engine command interface"

  constraints:
    - "Must open the gateway session (S1), then load the checkpoint at IP-AGENT-RUN-WORKSPACE and re-enter the saved state (S6 or S7) without repeating process agreement (S2), validation (S3), binding (S4) or build (S5)."
    - "Must, in S6, let E1 send RESTART(node) at the node after the last completed one, never repeat a completed procedure step or a node whose products are complete, and continue an interrupted cognitive node's stored session; a run suspended in resolution re-enters resolution."
    - "Must work after the container was removed and created again, because the workspace is on the host (SSR-AGG-015)."

  post_conditions:
    - "Completed work was not repeated."
    - "The run continued in the saved state."
