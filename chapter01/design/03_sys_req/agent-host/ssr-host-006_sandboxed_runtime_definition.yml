SSR-HOST-006:
  title: "Define the sandboxed runtime in the container engine configuration of agent-host"
  kind: "structural"
  usecase_step_ref: "USC-001: steps 6, 8"

  # Changed 2026-11-22: wording only (VM instead of distro); the entry and the eight args are unchanged. systrap is kept
  # (a KVM platform would need nested virtualization inside the VM).
  # Flags: systrap (no KVM in the VM), network=sandbox (userspace network stack), net-raw=false (no raw sockets),
  # allow-flag-override=false (no per-container change of runtimeArgs), overlay2=root:memory (root filesystem writes held in memory),
  # file-access=exclusive and file-access-mounts=shared (gVisor file access modes), directfs=false (no direct file descriptor access to the host filesystem).
  statement: "The system shall hold in the container engine configuration of the agent-host VM a runtime entry named runsc with the path /usr/local/bin/runsc and the runtime arguments --platform=systrap, --network=sandbox, --net-raw=false, --allow-flag-override=false, --overlay2=root:memory, --file-access=exclusive, --file-access-mounts=shared and --directfs=false."

  condition: "From the verified creation until the VM is removed."

  interface_points:
    - "IP-HOST-EXEC Direct command execution on the foundation VM"

  constraints:
    - "Must show, in the container engine configuration file on the VM, the runtime entry runsc with path /usr/local/bin/runsc, checked as the user agent-operator, which SFR-HOST-012 writes."
    - "Must show the runtime arguments of that entry equal to the eight listed arguments, in the listed order, with no further argument."
    - "Must show the container engine reporting runsc among its runtimes, checked on the running VM as the user root, because only root accesses the container engine socket."
    - "Must leave the reader's machine unchanged by construction, as SSR-HOST-005 states; no before/after comparison is made."
