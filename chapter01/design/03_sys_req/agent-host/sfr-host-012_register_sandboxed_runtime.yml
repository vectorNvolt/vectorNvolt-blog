SFR-HOST-012:
  title: "Register the sandboxed runtime in the container engine of agent-host"
  kind: "functional"
  usecase_step_ref: "USC-001: step 6 (exception err-4)"

  # Changed 2026-11-22: runs directly as root on the VM (no wsl.exe, no dev-distro to leave unchanged).
  statement: "The system shall register the sandboxed container runtime in the container engine configuration of the agent-host VM and restart the container engine service so that the runtime takes effect."

  condition: "When the required dependencies have been installed on the VM."

  interface_points:
    - "IP-HOST-EXEC Direct command execution on the foundation VM"
    - "IP-CLI-CREATE-AGENT-HOST Developer command-line entrypoint"

  constraints:
    - "Must execute the registration (runsc install) and the container engine service restart on the VM as the user root through IP-HOST-EXEC."
    - "Must make /usr/local/bin owned root:root with mode 755 and copy (not symlink) the packaged runsc binary to /usr/local/bin/runsc, root:root mode 755, before registering it."
    - "Must write the runtime entry into the container engine configuration file /etc/docker/daemon.json on the VM."
    - "Must register runsc with the path /usr/local/bin/runsc and the eight runtimeArgs defined in SSR-HOST-006 (--platform=systrap, --network=sandbox, --net-raw=false, --allow-flag-override=false, --overlay2=root:memory, --file-access=exclusive, --file-access-mounts=shared, --directfs=false)."
    - "Must leave /etc/docker/daemon.json owned root:root, readable by agent-operator and not writable by agent-operator."
    - "Must change nothing on the reader's machine (the host that runs the VM)."
    - "Must, when the registration or the restart fails, stop, report the failed step to the error output at IP-CLI-CREATE-AGENT-HOST and return exit status 2."

  post_conditions:
    - "The reader's machine has not been changed."
    - "The runtime entry is registered in /etc/docker/daemon.json and the container engine service has been restarted when the registration succeeded."
    - "The runtime entry holds the path /usr/local/bin/runsc and the eight runtimeArgs of SSR-HOST-006 when the registration succeeded."
    - "/etc/docker/daemon.json is owned root:root, readable but not writable by agent-operator."
