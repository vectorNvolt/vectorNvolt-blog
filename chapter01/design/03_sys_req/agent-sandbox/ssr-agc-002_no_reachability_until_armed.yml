SSR-AGC-002:
  title: "Hold the container unreachable until the host-side controls are verified"
  kind: "structural"
  usecase_step_ref: "USC-002: steps 4, 5, 6, 7 (exception err-8)"

  statement: "The system shall hold every agent container without network reachability until its host-side controls are verified, although it is attached to the agent network from its creation."

  condition: "For every agent container, from its creation until it is released (unpaused after the verified arming), or until it is removed after a failed arming."

  interface_points:
    - "IP-AGENT-NET Agent network control"
    - "IP-DOCKER-ENGINE Docker engine command interface"

  constraints:
    - "Must rely on the agents-net gate (SFR-NET-025, SSR-NET-005) to keep the container closed from its creation: attached to agents-net, but with its MAC not in the set released, so that no frame to or from any other agent, the host or an external destination passes. Before the container is started the tool checks only that the network agents-net exists (SFR-AGC-003); it makes no gate check before the start. The closure is verified by the tool at the arming step, by create_agent_net check-gate (exit 0 required) while the container is still paused, and the container is released only after that check passed. The verification is not a one-off: after the release the guard repeats check-gate on every start, unpause, die, update, network connect and network disconnect event of the container and at every reconcile (SFR-AGC-025, SFR-AGC-027)."
    - "Must show the container created attached to agents-net (--network agents-net) and to no other network, and never attached or detached later by the tool: the attachment is made at creation because gVisor does not see interfaces added after the start, and the container is paused (SFR-AGC-012) before SFR-AGC-007 arms it. A network connect or disconnect made by anyone else is an event the guard checks: the container confinement control of check-gate (restart policy no, agents-net only, running; SFR-NET-021) fails and the guard removes the container (SFR-AGC-025)."
    - "Must, after any failure of the arming, run create_agent_net disarm first; the container is removed only when the disarm exited 0, otherwise it is left paused behind the gate, which SFR-AGC-008 handles. The tool does not inspect the gate again after a failed arming."
    - "Must show the host-side controls and the gate held outside the container, so that the agent cannot see or clear them."
