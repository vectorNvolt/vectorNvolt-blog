SSR-AGC-009:
  title: "Grant the agent container only an explicit capability allowlist"
  kind: "structural"
  usecase_step_ref: "USC-002: steps 4, 9"

  statement: "The system shall hold every agent container with every capability removed except those on an explicit allowlist."

  condition: "For every agent container, from its creation until it is removed."

  interface_points:
    - "IP-DOCKER-ENGINE Docker engine command interface"

  constraints:
    - "Must show the capability set of the container holding no capability other than SYS_ADMIN, SYS_CHROOT, MKNOD, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, SETUID, SETGID, SETPCAP, SETFCAP, KILL, AUDIT_WRITE, NET_BIND_SERVICE, SYS_RESOURCE and NET_ADMIN, inspected on the container at IP-DOCKER-ENGINE, which SFR-AGC-006 establishes."
    - "Must show every capability removed by default and each retained capability granted by name, so that a capability is present only if it is written on the allowlist."
    - "Must show NET_RAW absent from the capability set of the container."
    - "Must show no request that grants all capabilities."
    - "NET_ADMIN is on the allowlist (dropped 2026-10-29, re-added 2026-11-12) so that the in-container engine can create a network namespace for an execution container with network mode `none` (USS-005, SSR-AGE-002). Evidence on the real host (2026-11-12): the agent container's effective capability set a92405fb lacked NET_ADMIN, and runc failed to start any container with a new network namespace (`runc create failed: unable to start container process: error during container init: operation not permitted`); with the network namespace removed every hardening setting worked (user 1001, all capabilities dropped, no-new-privileges, read-only root, noexec tmpfs, masked and read-only paths, cgroup mount, seccomp, memory, processor and process-count limits)."
    - "Accepted because the capability is held by the gVisor Sentry, not by the agent-host kernel, and acts only on the sandbox's own network stack; the egress gate (agent-net on agent-host) is outside its reach; the agent workload runs as uid 1001 with no-new-privileges and holds no effective capability (only root processes inside the container, dockerd and runc, use it); and ephemeral containers keep network mode `none` (host only in the fetch phase of an install) with all capabilities dropped. NET_RAW stays absent."
