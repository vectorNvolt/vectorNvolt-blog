SSR-AGC-013:
  title: "Mount no credential, signing key or keyring and declare the mode of every mount"
  kind: "structural"
  usecase_step_ref: "USC-002: steps 4, 9"

  statement: "The system shall mount no credential, signing key or keyring into any agent container, let credentials arise only inside the container, created by the agent at runtime, and declare the access mode of every mount explicitly."

  condition: "For every agent container, from its creation until it is removed."

  interface_points:
    - "IP-DOCKER-ENGINE Docker engine command interface"

  constraints:
    - "Must show no mount of the container, inspected on the container at IP-DOCKER-ENGINE and not from the creation request, that carries a credential, a signing key or a keyring."
    - "Must show credentials created only inside the container by the agent at runtime (the web-based login of USS-003), stored under /home/agent/.claude, which is the per-agent Claude state directory of SFR-AGC-006 (written only by the agent in the container, so the login and history survive recreating the container and are dropped only by remove_agent_container --purge), and none injected, copied or mounted from the host by the creation tool."
    - "Must show every mount of the container carrying an explicit read-only or read-write mode fixed at creation, with none left to a default."
    - "Must show the workspace folder and the Claude state directory of SSR-AGC-004 as the only read-write mounts that SFR-AGC-006 creates, and any further mount (the host DNS file) read-only."
