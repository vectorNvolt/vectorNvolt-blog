SSR-IMG-005:
  title: "Keep credentials out of the agent image"
  kind: "structural"
  usecase_step_ref: "USC-003: step 6, postconditions"

  statement: "The system shall keep every credential out of the agent image."

  condition: "For every agent image created, from its build in the agent-host onward."

  interface_points:
    - "IP-IMAGE-BUILD-CONTEXT Image build inputs"
    - "IP-DOCKER-ENGINE Docker engine command interface"

  constraints:
    - "Must show no credential in the content of the image as built from the build inputs at IP-IMAGE-BUILD-CONTEXT."
    - "Must show no credential in the image as present in the agent-host Docker engine at IP-DOCKER-ENGINE."
    - "Must verify the absence of credentials in the image metadata by a check the tool performs after the build, without starting a container, as part of the verification of SFR-IMG-016: `docker image inspect` (Config.Env and Config.Labels) and `docker history --no-trunc` (CreatedBy lines) of the built image at IP-DOCKER-ENGINE."
    - "Must treat an environment variable name (of `Config.Env`) as credential-like when it contains TOKEN, SECRET, PASSWORD, PASSWD, API_KEY, APIKEY, CREDENTIAL or PRIVATE_KEY as a substring, compared case-insensitively. Label keys and history lines are not checked for names."
    - "Must treat an environment value, a label value or a history line as credential-like when it contains one of the prefixes `ghp_`, `gho_`, `ghs_`, `github_pat_` or `sk-ant-`, the string `AKIA` followed by 16 characters of `[0-9A-Z]`, or `-----BEGIN` followed on the same line by `PRIVATE KEY`."
    - "Must scan in this order and stop at the first finding: environment entries (name, then value), label values in label-key order, history lines newest first."
    - "Must end the run with exit status 2 and the state UNVERIFIED at IP-CLI-CREATE-AGENT-IMAGE when the check finds a credential-like name or value, with the image left in place and no rollback, as for a verification failure of SFR-IMG-016."
    - "Must name the offending environment variable, label key or history step (newest first, 1-based) in the failure report and never print the matched value."
    - "Must also pass a static test over `Dockerfile.agent` at IP-IMAGE-BUILD-CONTEXT, as part of verification: the credential-like name rule applied to the names of its `ENV` and `ARG` instructions only (value patterns are not applied statically), `COPY` and `ADD` limited to `requirements.lock`, and `ENV CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1` present."
