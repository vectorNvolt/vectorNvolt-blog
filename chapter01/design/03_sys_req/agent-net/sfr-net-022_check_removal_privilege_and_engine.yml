SFR-NET-022:
  title: "Check privilege and container engine before removing anything"
  kind: "functional"
  usecase_step_ref: "USC-007: step 2, err-2"

  statement: "The system shall check before removing anything that the network removal tool runs as the administrative user with network-administration rights in the agent host's own network scope and with access to the container engine's control socket, and that the container engine is reachable, and stop with nothing changed otherwise."

  condition: "When the removal request has been accepted."

  interface_points:
    - "IP-DOCKER-ENGINE Docker engine command interface"
    - "IP-CLI-REMOVE-AGENT-NET Network removal entrypoint"

  constraints:
    - "Must check the administrative user, the network-administration rights, the access to the control socket and the reachability of the engine at IP-DOCKER-ENGINE before anything is removed."
    - "Must write a failure report naming the missing privilege or the unreachable engine to the error output at IP-CLI-REMOVE-AGENT-NET when a check fails."
    - "Must return `exit_code: 1`, state `NOT_REMOVED`, at IP-CLI-REMOVE-AGENT-NET when a check fails."
    - "Must show nothing changed when a check fails."

  post_conditions:
    - "Nothing has been changed when a check failed."
    - "When all checks held, the run continues with the survey of what exists."
