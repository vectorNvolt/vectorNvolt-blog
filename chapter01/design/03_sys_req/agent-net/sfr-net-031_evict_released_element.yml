SFR-NET-031:
  title: "Evict one released element by MAC"
  kind: "functional"
  usecase_step_ref: "USC-004: alt-5"

  statement: "The system shall remove exactly one element, named by its MAC address, from the set released of the agents-net gate and touch nothing else of the gate."

  condition: "When the tool is invoked as `evict <mac>`, for an element that carries no container name or whose container is gone."

  interface_points:
    - "IP-AGENT-NET Agent network control"
    - "IP-CLI-CREATE-AGENT-NET Developer command-line entrypoint"

  constraints:
    - "Must delete only the element with that MAC from released, and never the table agents_gate, its chains, its other elements or the rule agent-net:gate."
    - "Must treat an element that is not in the set as no error and report that the MAC is not in the set."
    - "Must read the set again after the deletion and fail when the MAC is still in it."
    - "Must check privilege and engine and compare the engine state as the other forms do (SFR-NET-002, SSR-NET-001)."
    - "Must return exit status 0 when the element was evicted or was not there, exit status 1 (state NOT_EVICTED) for an invalid invocation or a missing privilege or prerequisite, and exit status 2 (state EVICT_INCOMPLETE) when the element could not be deleted or is still there; it can be run again."

  post_conditions:
    - "The MAC is not in released."
    - "Every other element and the rest of the gate are unchanged."
